<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Daraz Inspired | Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="../assets/css/styles.css" />
  </head>
  <body data-page="login">
    <div id="site-header"></div>
    <div id="mobile-nav"></div>

    <main class="page auth-page">
      <div class="container py-5">
        <div class="row justify-content-center">
          <div class="col-lg-6">
            <div class="card auth-card">
              <div class="card-body">
                <h1 class="h4 mb-2">Welcome Back</h1>
                <p class="text-muted">Login with your email or phone.</p>
                <form id="loginForm">
                  <div class="mb-3">
                    <label class="form-label">Email or Phone</label>
                    <input type="text" class="form-control" name="identifier" required />
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" name="password" required />
                  </div>
                  <div id="loginMessage" class="small mb-3"></div>
                  <button class="btn btn-dark w-100" type="submit">Login</button>
                </form>
                <div class="text-center mt-3 small">
                  New to Daraz? <a href="signup.html">Create an account</a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <div id="site-footer"></div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/ui.js"></script>
    <script src="../assets/js/store.js"></script>
    <script src="../assets/js/cart.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/login.js"></script>
  </body>
</html>
