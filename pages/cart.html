<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Daraz Inspired | Cart</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="../assets/css/styles.css" />
  </head>
  <body data-page="cart">
    <div id="site-header"></div>
    <div id="mobile-nav"></div>

    <main class="page cart-page">
      <div class="container py-4">
        <h1 class="h4 mb-3">Shopping Cart</h1>
        <div class="row g-4">
          <section class="col-lg-8">
            <div id="cart-list"></div>
            <div id="cart-empty" class="text-center text-muted d-none">
              <i class="fa-solid fa-cart-shopping fa-2x mb-2"></i>
              <p class="mb-3">Your cart is empty.</p>
              <a href="home.html" class="btn btn-outline-dark">Continue Shopping</a>
            </div>

            <div class="recommendations mt-4">
              <div class="d-flex align-items-center justify-content-between">
                <h2 class="h6 mb-0">You may also like</h2>
                <a href="category.html" class="btn btn-sm btn-outline-secondary">View all</a>
              </div>
              <div id="cart-recommendations" class="row g-3 mt-2"></div>
            </div>
          </section>

          <aside class="col-lg-4">
            <div class="card summary-card">
              <div class="card-body">
                <h2 class="h6">Order Summary</h2>
                <div class="d-flex align-items-center justify-content-between">
                  <span>Subtotal</span>
                  <span id="summary-subtotal">NPR 0</span>
                </div>
                <div class="d-flex align-items-center justify-content-between mt-2">
                  <span>Shipping</span>
                  <span id="summary-shipping">NPR 0</span>
                </div>
                <div class="d-flex align-items-center justify-content-between mt-2">
                  <span>Discount</span>
                  <span id="summary-discount">- NPR 0</span>
                </div>
                <div class="mt-3">
                  <label class="form-label">Coupon</label>
                  <div class="input-group">
                    <input type="text" class="form-control" id="couponInput" placeholder="Enter code" />
                    <button class="btn btn-outline-dark" id="applyCoupon" type="button">Apply</button>
                  </div>
                  <div id="couponMessage" class="small mt-2"></div>
                </div>
                <hr />
                <div class="d-flex align-items-center justify-content-between fw-semibold">
                  <span>Total</span>
                  <span id="summary-total">NPR 0</span>
                </div>
                <button class="btn btn-dark w-100 mt-3" id="checkoutBtn">Proceed to Checkout</button>
              </div>
            </div>
          </aside>
        </div>
      </div>
    </main>

    <div id="site-footer"></div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/ui.js"></script>
    <script src="../assets/js/store.js"></script>
    <script src="../assets/js/cart.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/cart-page.js"></script>
  </body>
</html>
