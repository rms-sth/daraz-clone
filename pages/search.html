<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Daraz Inspired | Search</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="../assets/css/styles.css" />
  </head>
  <body data-page="search">
    <div id="site-header"></div>
    <div id="mobile-nav"></div>

    <main class="page search-page">
      <div class="container py-4">
        <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-3">
          <div>
            <h1 class="h5 mb-1">Search Results</h1>
            <div class="text-muted small">
              <span id="search-count">0</span> items for "<span id="search-term"></span>"
            </div>
            <div id="did-you-mean" class="small text-warning mt-1"></div>
          </div>
          <div class="d-flex align-items-center gap-2">
            <label class="small text-muted" for="searchSort">Sort by</label>
            <select id="searchSort" class="form-select form-select-sm">
              <option value="relevance">Relevance</option>
              <option value="price-asc">Price: Low to High</option>
              <option value="price-desc">Price: High to Low</option>
              <option value="rating">Rating</option>
            </select>
          </div>
        </div>

        <div class="row g-4">
          <aside class="col-lg-3">
            <div class="filter-panel card">
              <div class="card-header bg-white fw-semibold">Filters</div>
              <div class="card-body">
                <div class="mb-3">
                  <label class="form-label">Price (NPR)</label>
                  <div class="d-flex gap-2">
                    <input type="number" class="form-control" id="searchMinPrice" placeholder="Min" />
                    <input type="number" class="form-control" id="searchMaxPrice" placeholder="Max" />
                  </div>
                </div>
                <div class="mb-3">
                  <label class="form-label">Brand</label>
                  <div id="searchBrandFilters" class="filter-list"></div>
                </div>
                <div class="mb-3">
                  <label class="form-label">Rating</label>
                  <div class="filter-list">
                    <div class="form-check">
                      <input class="form-check-input" type="radio" name="searchRating" value="4" id="searchRating4" />
                      <label class="form-check-label" for="searchRating4">4★ & above</label>
                    </div>
                    <div class="form-check">
                      <input class="form-check-input" type="radio" name="searchRating" value="3" id="searchRating3" />
                      <label class="form-check-label" for="searchRating3">3★ & above</label>
                    </div>
                    <div class="form-check">
                      <input class="form-check-input" type="radio" name="searchRating" value="0" id="searchRatingAll" checked />
                      <label class="form-check-label" for="searchRatingAll">All ratings</label>
                    </div>
                  </div>
                </div>
                <button class="btn btn-outline-secondary w-100" id="searchClearFilters">Clear Filters</button>
              </div>
            </div>
          </aside>

          <section class="col-lg-9">
            <div id="search-grid" class="row g-3"></div>
            <nav class="mt-4" aria-label="Pagination">
              <ul class="pagination justify-content-center" id="search-pagination"></ul>
            </nav>
          </section>
        </div>
      </div>
    </main>

    <div id="site-footer"></div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/ui.js"></script>
    <script src="../assets/js/store.js"></script>
    <script src="../assets/js/cart.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/search.js"></script>
  </body>
</html>
