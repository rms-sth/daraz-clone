<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Daraz Inspired | Product</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="../assets/css/styles.css" />

  <body data-page="product">
    <div id="site-header"></div>
    <div id="mobile-nav"></div>

    <main class="page product-page">
      <div class="container py-4">
        <nav aria-label="breadcrumb" class="mb-3">
          <ol class="breadcrumb" id="product-breadcrumb">
            <li class="breadcrumb-item"><a href="home.html">Home</a></li>
            <li class="breadcrumb-item"><a href="category.html">Category</a></li>
            <li class="breadcrumb-item active" aria-current="page">Product</li>

        <div id="product-detail" class="product-detail"></div>

    </main>

    <div class="mobile-cart-bar d-lg-none" id="mobile-cart-bar">
      <div class="container d-flex align-items-center justify-content-between">
        <div>
          <div class="small text-muted">Total</div>

        <button class="btn btn-dark btn-sm" id="mobile-add-cart">Add to Cart</button>
      </div>
    </div>

    <div id="site-footer"></div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
