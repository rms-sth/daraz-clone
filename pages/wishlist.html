<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Daraz Inspired | Wishlist</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="../assets/css/styles.css" />
  </head>
  <body data-page="wishlist">
    <div id="site-header"></div>
    <div id="mobile-nav"></div>

    <main class="page wishlist-page">
      <div class="container py-4">
        <div class="d-flex align-items-center justify-content-between flex-wrap gap-2">
          <h1 class="h4 mb-0">Wishlist</h1>
          <a href="home.html" class="btn btn-sm btn-outline-secondary">Continue Shopping</a>
        </div>

        <div id="wishlist-grid" class="row g-3 mt-3"></div>
        <div id="wishlist-empty" class="text-center text-muted mt-4 d-none">
          <i class="fa-regular fa-heart fa-2x mb-2"></i>
          <p>Your wishlist is empty.</p>
        </div>

        <div class="followed-stores mt-4">
          <h2 class="h6">Followed Stores</h2>
          <div id="followed-stores-list" class="row g-3 mt-2"></div>
        </div>
      </div>
    </main>

    <div id="site-footer"></div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/ui.js"></script>
    <script src="../assets/js/store.js"></script>
    <script src="../assets/js/cart.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/wishlist.js"></script>
  </body>
</html>
