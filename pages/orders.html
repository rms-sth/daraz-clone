<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Daraz Inspired | My Orders</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="../assets/css/styles.css" />
  </head>
  <body data-page="orders">
    <div id="site-header"></div>
    <div id="mobile-nav"></div>

    <main class="page orders-page">
      <div class="container py-4">
        <div class="d-flex align-items-center justify-content-between flex-wrap gap-2">
          <h1 class="h4 mb-0">My Orders</h1>
          <div class="btn-group" role="group">
            <button class="btn btn-outline-secondary active" data-status="all">All</button>
            <button class="btn btn-outline-secondary" data-status="placed">Placed</button>
            <button class="btn btn-outline-secondary" data-status="shipped">Shipped</button>
            <button class="btn btn-outline-secondary" data-status="delivered">Delivered</button>
            <button class="btn btn-outline-secondary" data-status="cancelled">Cancelled</button>
          </div>
        </div>
        <div id="orders-list" class="mt-3"></div>
      </div>
    </main>

    <div id="site-footer"></div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/ui.js"></script>
    <script src="../assets/js/store.js"></script>
    <script src="../assets/js/cart.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/orders.js"></script>
  </body>
</html>
