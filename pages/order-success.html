<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Daraz Inspired | Order Success</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="../assets/css/styles.css" />
  </head>
  <body data-page="order-success">
    <div id="site-header"></div>
    <div id="mobile-nav"></div>

    <main class="page order-success-page">
      <div class="container py-5">
        <div class="card success-card text-center mx-auto">
          <div class="card-body">
            <div class="success-icon mb-3">
              <i class="fa-solid fa-circle-check"></i>
            </div>
            <h1 class="h4 mb-2">Order Placed Successfully!</h1>
            <p class="text-muted mb-4">Thank you for shopping with us. Your order has been confirmed.</p>
            <div class="order-summary text-start" id="order-summary"></div>
            <div class="d-flex flex-wrap justify-content-center gap-2 mt-4">
              <a href="orders.html" class="btn btn-outline-dark">Track Order</a>
              <a href="home.html" class="btn btn-dark">Continue Shopping</a>
            </div>
          </div>
        </div>
      </div>
    </main>

    <div id="site-footer"></div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/ui.js"></script>
    <script src="../assets/js/store.js"></script>
    <script src="../assets/js/cart.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/order-success.js"></script>
  </body>
</html>
